  viewBox="0 0 1200 360"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">finanzr.</title>
  <desc id="description">
    Finanzr logo over an abstract green financial dashboard with charts.
  </desc>

  <defs>
    <clipPath id="canvas">
      <rect width="1200" height="360" rx="28" />
    </clipPath>
    <linearGradient id="canvas-fill" x1="72" y1="14" x2="1128" y2="346" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080d0a" />
      <stop offset="0.48" stop-color="#101e17" />
      <stop offset="1" stop-color="#19251e" />
    </linearGradient>
    <linearGradient id="chart-area" x1="174" y1="114" x2="174" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4bd2a0" stop-opacity="0.34" />
      <stop offset="1" stop-color="#4bd2a0" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="logo-fill" x1="324" y1="126" x2="432" y2="234" gradientUnits="userSpaceOnUse">
      <stop stop-color="#66d8a6" />
      <stop offset="1" stop-color="#4bc993" />
    </linearGradient>
    <linearGradient id="mark-fill" x1="357" y1="144" x2="397" y2="218" gradientUnits="userSpaceOnUse">
      <stop stop-color="#001d13" />
      <stop offset="1" stop-color="#002419" />
