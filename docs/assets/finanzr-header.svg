    </filter>
    <filter id="brand-shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020604" flood-opacity="0.36" />
    </filter>
  </defs>

