services:
  db:
    image: postgres:17-alpine
    environment:
      PYTHONPATH: /app
      POSTGRES_DB: ${POSTGRES_DB:-finanzr}
      POSTGRES_USER: ${POSTGRES_USER:-finanzr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finanzr-dev}
    ports:
      - "${POSTGRES_PORT_FORWARD:-5432}:5432"
    volumes:
      - finanzr_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-unsafe-development-only}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:5173}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-finanzr}
      POSTGRES_USER: ${POSTGRES_USER:-finanzr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finanzr-dev}
    ports:
      - "${DJANGO_PORT:-8000}:8000"
    volumes:
      - ./backend:/app/backend
      - ./finanzr:/app/finanzr:ro
      - ./data:/app/data:ro
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: development
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
    depends_on:
      - backend

volumes:
  finanzr_postgres_data:
