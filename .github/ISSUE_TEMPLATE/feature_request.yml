name: Feature request
description: Propose an improvement to Finanzr
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem first. Do not include personal financial records.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Who needs this and what is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope checks
      options:
        - label: This request does not require sharing private financial data.
          required: true
        - label: I have checked that a similar request is not already open.
          required: true
