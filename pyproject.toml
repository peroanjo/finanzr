[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["backend", "."]
# Only backend/tests: both tests/ directories are Python packages named
# ``tests``, so collecting both in one run collides on module resolution. The
# standard-library domain suites under tests/ run through their dedicated CI
# job via ``python -m unittest discover -s tests``.
testpaths = ["backend/tests"]
addopts = "--strict-markers --strict-config"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["backend/**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
ignore = ["DJ001"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
strict = true
# The root tests/ directory collides with backend/tests on the module name
# "tests" and holds only standard-library domain suites already checked by
# ruff and their dedicated CI job, so strict typing targets backend + finanzr.
exclude = ["backend/.*/migrations/", "^tests/"]

[tool.django-stubs]
django_settings_module = "config.settings.test"
